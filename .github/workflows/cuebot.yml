name: Cuebot

# Builds Cuebot and runs its unit tests.

on:
  workflow_call:
    inputs:
      coverage:
        description: Also write the JaCoCo coverage report and upload it as cuebot-coverage.
        type: boolean
        default: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build with Gradle
        working-directory: cuebot
        run: ./gradlew build ${{ inputs.coverage && 'jacocoTestReport' || '' }} --stacktrace

      - name: Upload coverage report
        if: inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: cuebot-coverage
          path: cuebot/build/reports/jacoco/
