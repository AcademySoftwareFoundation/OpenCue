name: Rust

# Checks formatting, runs clippy and the tests of the Rust workspace on Linux, and of rqd on
# Windows.

on:
  workflow_call:
    inputs:
      windows:
        description: Also run clippy and the rqd tests on Windows.
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Runners are ephemeral, so incremental compilation only costs disk I/O.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Keeps file:line in panic backtraces while skipping most debuginfo.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # mold is invoked through `mold -run`, so it needs no linker config.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev protobuf-compiler libcurl4-openssl-dev mold

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # opencue-proto's sources are generated by its build script, so it is left out.
      - name: Check formatting
        run: |
          mapfile -t packages < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name != "opencue-proto") | "-p", .name')
          cargo fmt --check "${packages[@]}"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          cache-on-failure: true
          # Only master saves, so pull requests don't push its entries out of the cache.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: nextest

      - name: Clippy
        run: mold -run cargo clippy

      # The rqd integration tests need the release dummy-cuebot; building it here keeps its
      # compile out of the per-test timeout in rust/.config/nextest.toml.
      - name: Build tests
        run: |
          mold -run cargo build -p dummy-cuebot --release
          mold -run cargo nextest run --no-run

      - name: Run tests
        run: cargo nextest run

  windows:
    name: Windows
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Real-time scanning of compiler output dominates Windows build time. Best effort:
      # Tamper Protection may block some of these.
      - name: Exclude build directories from Defender
        shell: pwsh
        working-directory: .
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cargo.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "rustc.exe" -ErrorAction SilentlyContinue

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install protoc
        run: |
          choco install protoc -y
          echo "PROTOC=C:\ProgramData\chocolatey\bin\protoc.exe" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          cache-on-failure: true
          # Only master saves, so pull requests don't push its entries out of the cache.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: nextest

      - name: Clippy
        run: cargo clippy -p rqd

      - name: Build tests
        run: |
          cargo build -p dummy-cuebot --release
          cargo nextest run -p rqd --no-run

      - name: Run tests
        run: cargo nextest run -p rqd
