name: Integration

# Builds the Cuebot and RQD images, starts the sandbox with docker compose on them and runs a
# job through it.

on:
  workflow_call:
    inputs:
      build-id:
        description: >-
          Version to bake into the images and tag them with (opencuebuild/<name>:<build-id>).
          When set, the tested images and the Cuebot jar and RPM are uploaded as artifacts.
        type: string
        default: ""
    outputs:
      cuebot-image-id:
        description: Image ID of the tested Cuebot image.
        value: ${{ jobs.test.outputs.cuebot-image-id }}
      rqd-image-id:
        description: Image ID of the tested RQD image.
        value: ${{ jobs.test.outputs.rqd-image-id }}

jobs:
  test:
    name: Integration test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      cuebot-image-id: ${{ steps.cuebot.outputs.imageid }}
      rqd-image-id: ${{ steps.rqd.outputs.imageid }}
    env:
      CUEBOT_IMAGE: opencuebuild/cuebot:${{ inputs.build-id || 'ci' }}
      RQD_IMAGE: opencuebuild/rqd:${{ inputs.build-id || 'ci' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Cuebot image
        id: cuebot
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cuebot/Dockerfile
          build-args: BUILD_ID=${{ inputs.build-id }}
          tags: ${{ env.CUEBOT_IMAGE }}
          load: true
          cache-from: type=gha,scope=cuebot
          cache-to: type=gha,scope=cuebot,mode=max

      - name: Build RQD image
        id: rqd
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: rust/Dockerfile.rqd
          tags: ${{ env.RQD_IMAGE }}
          load: true
          cache-from: type=gha,scope=rqd
          cache-to: type=gha,scope=rqd,mode=max

      - name: Run test
        run: ci/run_integration_test.sh

      - name: Archive log files
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs
          path: /tmp/opencue-test/*.log

      - name: Export images and Cuebot packages
        if: inputs.build-id != ''
        env:
          BUILD_ID: ${{ inputs.build-id }}
        run: |
          mkdir -p cuebot-packages images
          container_id=$(docker create "${CUEBOT_IMAGE}")
          for file in "cuebot-${BUILD_ID}-all.jar" "opencue-cuebot-${BUILD_ID}-1.noarch.rpm"; do
            docker cp "${container_id}:/opt/opencue/${file}" cuebot-packages/
          done
          docker rm "${container_id}"
          docker save -o images/cuebot.tar "${CUEBOT_IMAGE}"
          docker save -o images/rqd.tar "${RQD_IMAGE}"

      - name: Upload Cuebot packages
        if: inputs.build-id != ''
        uses: actions/upload-artifact@v7
        with:
          name: cuebot-packages
          path: cuebot-packages/
          if-no-files-found: error
          overwrite: true

      - name: Upload Cuebot image
        if: inputs.build-id != ''
        uses: actions/upload-artifact@v7
        with:
          name: image-cuebot
          path: images/cuebot.tar
          compression-level: 1
          retention-days: 7
          if-no-files-found: error
          overwrite: true

      - name: Upload RQD image
        if: inputs.build-id != ''
        uses: actions/upload-artifact@v7
        with:
          name: image-rqd
          path: images/rqd.tar
          compression-level: 1
          retention-days: 7
          if-no-files-found: error
          overwrite: true
