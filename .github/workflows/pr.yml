name: OpenCue PR

# TEMPORARY, DO NOT MERGE: runs master.yml with publishing off, then builds each image again
# from the Phase 3 Dockerfiles at the same commit and compares it with the image master built.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  master:
    name: Master
    uses: ./.github/workflows/master.yml
    with:
      publish: false

  equivalence:
    name: Equivalence probe (${{ matrix.image }})
    needs: master
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cuebot
            context: .
          - image: rqd
            context: .
          - image: rest-gateway
            context: .
          - image: cueweb
            context: cueweb
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}

      - name: Load the image master built
        id: new
        run: |
          build_id=$(ci/generate_version_number.py)
          echo "build-id=${build_id}" >> "${GITHUB_OUTPUT}"
          docker load -i "${RUNNER_TEMP}/${IMAGE}.tar"
          docker image inspect "opencuebuild/${IMAGE}:${build_id}" --format '{{.Id}}'

      - name: Build the same commit with the Phase 3 Dockerfile
        run: |
          args=(--load -t "old/${IMAGE}:probe" -f ".github/dry-run/${IMAGE}.Dockerfile")
          case "${IMAGE}" in
            cuebot) args+=(--build-arg "BUILD_ID=${{ steps.new.outputs.build-id }}") ;;
            cueweb) args+=(--build-context project_root=. --build-arg "NEXT_PUBLIC_GIT_SHA=${GITHUB_SHA::7}") ;;
          esac
          time docker buildx build "${args[@]}" "${{ matrix.context }}"

      - name: Compare
        run: |
          python3 .github/dry-run/compare_images.py "old/${IMAGE}:probe" \
            "opencuebuild/${IMAGE}:${{ steps.new.outputs.build-id }}" | tee -a "${GITHUB_STEP_SUMMARY}"

      # Next.js builds are not reproducible: this shows what two builds of the old Dockerfile
      # already differ in.
      - name: Compare two builds of the Phase 3 Dockerfile
        if: matrix.image == 'cueweb'
        run: |
          docker buildx build --load --no-cache -t old/cueweb:probe2 -f .github/dry-run/cueweb.Dockerfile \
            --build-context project_root=. --build-arg "NEXT_PUBLIC_GIT_SHA=${GITHUB_SHA::7}" cueweb
          python3 .github/dry-run/compare_images.py old/cueweb:probe old/cueweb:probe2 | tee -a "${GITHUB_STEP_SUMMARY}"

      - uses: actions/download-artifact@v8
        if: matrix.image == 'cuebot'
        with:
          name: cuebot-packages
          path: new-packages

      - name: Compare the jar and RPM with the ones the old image carries
        if: matrix.image == 'cuebot'
        env:
          BUILD_ID: ${{ steps.new.outputs.build-id }}
        run: |
          mkdir -p old-packages
          cid=$(docker create "old/cuebot:probe")
          docker cp "${cid}:/opt/opencue/cuebot-${BUILD_ID}-all.jar" old-packages/
          docker cp "${cid}:/opt/opencue/opencue-cuebot-${BUILD_ID}-1.noarch.rpm" old-packages/
          docker rm "${cid}"
          {
            echo '### Jar and RPM'
            echo '```'
            ls -l old-packages new-packages
            sha256sum old-packages/* new-packages/*
            echo '```'
            echo 'RPM headers and file manifests (path size sha256 mode owner group):'
            echo '```'
            docker run --rm -v "${PWD}:/w:ro" jc21/rpmbuild-centos7:latest bash -c '
              for r in /w/old-packages/*.rpm /w/new-packages/*.rpm; do
                echo "== ${r}"
                rpm -qp --qf "%{NAME} %{VERSION} %{RELEASE} %{ARCH} requires=[%{REQUIRES},]\n" "${r}"
                rpm -qp --dump "${r}" | awk "{print \$1, \$2, \$4, \$5, \$6, \$7}"
                rpm -qp --scripts "${r}" | sha256sum
              done'
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          old_jar=$(sha256sum < "old-packages/cuebot-${BUILD_ID}-all.jar")
          new_jar=$(sha256sum < "new-packages/cuebot-${BUILD_ID}-all.jar")
          [[ "${old_jar}" == "${new_jar}" ]] && echo "The jars are byte-identical."
