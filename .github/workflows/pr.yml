name: OpenCue PR

# TEMPORARY, DO NOT MERGE: builds the five openrqd release targets, which otherwise only run
# on master, to check the setup-protoc install.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  rust-binaries:
    name: Rust binaries
    uses: ./.github/workflows/rust-binaries.yml
    with:
      build-id: 0.0.0-dryrun
