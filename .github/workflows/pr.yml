name: OpenCue PR

# TEMPORARY, DO NOT MERGE: runs master.yml with publishing off, plus a probe of the release
# pipeline's Python 3.7 wheel build after M5.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  master:
    name: Master
    uses: ./.github/workflows/master.yml
    with:
      publish: false

  m5-probe:
    name: M5 probe (release-style build on Python 3.7)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: python:3.7
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Build like release-pipeline.yml does
        run: |
          set -e
          pip install build==1.1.1
          for p in proto pycue pyoutline cueadmin cueman cuecmd cuesubmit cuegui rqd cuenimby; do
            python -m build --outdir packages -s "./${p}"
            python -m build --outdir packages -w "./${p}"
          done
          ls packages
      - name: Python 3.7 pip refuses the wheels
        run: |
          for whl in packages/*.whl; do
            if pip install --no-deps "${whl}"; then
              echo "::error::${whl} installed on Python 3.7"
              exit 1
            fi
          done
          echo "pip refused every wheel on Python 3.7"

  stage-probe:
    name: Stage probe (load the image artifacts, compare IDs, no push)
    needs: master
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [cuebot, rqd, rest-gateway, cueweb]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: bundle
      - name: Load and compare
        env:
          NAME: ${{ matrix.image }}
        run: |
          docker load -i "${RUNNER_TEMP}/${NAME}.tar"
          tag=$(jq -r --arg n "${NAME}" '.images[$n].tag' bundle/build_metadata.json)
          want=$(jq -r --arg n "${NAME}" '.images[$n].id' bundle/build_metadata.json)
          got=$(docker image inspect --format '{{.Id}}' "${tag}")
          echo "${tag}: metadata ${want}, loaded ${got}"
          [[ "${want}" == "${got}" ]]
