name: OpenCue PR

# TEMPORARY (DO NOT MERGE): calls release.yml in dry-run mode against the release-bundle of
# run 44663836822 (Phase 2's dry run), and runs the publishing jobs' checks without publishing.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  release:
    name: Release
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      actions: read
    with:
      tag: v1.39.1-cd7663ea
      sha: cd7663ea349a0737512c343fdf5d1764f18b8251
      run-id: "44663836822"
      dry-run: true

  # The steps github-release and publish run before they publish, fed by preflight's outputs.
  pinned:
    name: Publish-job checks, no publishing
    needs: release-outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      TAG: v1.39.1-cd7663ea
      RUN_ID: "44663836822"
      ARTIFACT_ID: ${{ needs.release-outputs.outputs.artifact-id }}
      DIGEST: ${{ needs.release-outputs.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the bundle is the one preflight chose
        run: |
          ci/release.py pinned --repo "${GITHUB_REPOSITORY}" --run-id "${RUN_ID}" \
            --artifact-id "${ARTIFACT_ID}" --digest "${DIGEST}"

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.release-outputs.outputs.artifact-id }}
          path: bundle
          run-id: "44663836822"
          github-token: ${{ github.token }}

      - name: Check the bundle, the file lists and the release action
        run: |
          ci/release.py verify --tag "${TAG}" --sha cd7663ea349a0737512c343fdf5d1764f18b8251 \
            --run-id "${RUN_ID}" bundle
          list="$(ci/release.py files github --tag "${TAG}")"
          mapfile -t assets <<< "${list}"
          ls -l "${assets[@]/#/bundle/}"
          list="$(ci/release.py files pypi --tag "${TAG}")"
          mapfile -t files <<< "${list}"
          ls -l "${files[@]/#/bundle/}"
          echo "${TAG}: $(ci/release.py github --repo "${GITHUB_REPOSITORY}" --tag "${TAG}")"
          echo "v1.37.0: $(ci/release.py github --repo "${GITHUB_REPOSITORY}" --tag v1.37.0)"

      - name: Expect a refusal for another artifact
        run: |
          if out="$(ci/release.py pinned --repo "${GITHUB_REPOSITORY}" --run-id "${RUN_ID}" \
              --artifact-id 1 --digest sha256:0 2>&1)"; then
            echo "::error::Expected a refusal"
            exit 1
          fi
          echo "${out}"
          grep -q "changed after preflight" <<< "${out}"

  # Reads preflight's outputs the way the later jobs get them (a caller can't read a called
  # workflow's job outputs directly, so this repeats the lookup).
  release-outputs:
    name: Preflight outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.find.outputs.artifact-id }}
      digest: ${{ steps.find.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci/release.py preflight --repo "${GITHUB_REPOSITORY}" --tag v1.39.1-cd7663ea \
            --sha cd7663ea349a0737512c343fdf5d1764f18b8251 --run-id 44663836822 --dry-run
