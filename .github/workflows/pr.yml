name: OpenCue PR

# TEMPORARY, DO NOT MERGE: runs master.yml with Maestro forced off and the stage jobs replaced
# by echo steps, to show the stage jobs run when Maestro is skipped.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  master:
    name: Master
    uses: ./.github/workflows/master.yml
    with:
      publish: true
