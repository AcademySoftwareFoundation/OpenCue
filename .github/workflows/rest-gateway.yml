name: REST gateway

# Runs the REST gateway's Go tests and builds its image.

on:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rest_gateway/opencue_gateway
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install Protocol Buffers Compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          # Same protoc as Ubuntu 24.04's protobuf-compiler package.
          version: "21.12"
          repo-token: ${{ github.token }}

      - name: Install Go tools
        run: |
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@latest
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate protobuf code
        run: |
          mkdir -p gen/go
          protoc -I ../../proto/src/ \
            --go_out ./gen/go/ \
            --go_opt paths=source_relative \
            --go-grpc_out ./gen/go/ \
            --go-grpc_opt paths=source_relative \
            ../../proto/src/*.proto
          protoc -I ../../proto/src/ \
            --grpc-gateway_out ./gen/go \
            --grpc-gateway_opt paths=source_relative \
            --grpc-gateway_opt generate_unbound_methods=true \
            ../../proto/src/*.proto

      - name: Generate OpenAPI definitions
        run: |
          mkdir -p gen/openapiv2
          protoc -I ../../proto/src/ \
            --openapiv2_out ./gen/openapiv2 \
            --openapiv2_opt generate_unbound_methods=true \
            --openapiv2_opt logtostderr=true \
            ../../proto/src/*.proto

      - name: Install Go dependencies
        run: |
          if [ ! -f go.mod ]; then go mod init opencue_gateway; fi
          # Keep this pin in sync with rest_gateway/Dockerfile. go.mod/go.sum are
          # not committed, so without it CI and the image can resolve different
          # versions of the Swagger UI assets.
          go get github.com/swaggo/files/v2@v2.0.2
          go mod tidy

      - name: Run unit tests with coverage
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic .
          go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rest-gateway-coverage
          path: rest_gateway/opencue_gateway/coverage.out

  image:
    name: Build image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build REST gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: rest_gateway/Dockerfile
          tags: opencue/rest-gateway:test
          cache-from: type=gha,scope=rest-gateway
          cache-to: type=gha,scope=rest-gateway,mode=max
