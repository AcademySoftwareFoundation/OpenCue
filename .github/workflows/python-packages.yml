name: Python packages

# Builds the sdists and wheels and checks the wheels install together.

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON list of Python versions to install the wheels on.
        type: string
        default: '["3.9", "3.10", "3.11"]'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: python:3.11
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Mark repository as safe
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - uses: ./.github/actions/build-python-packages

  install:
    name: Install on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    container: python:${{ matrix.python-version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: opencue_packages
          path: packages

      - name: Install packages
        run: |
          pip install packages/*.whl
          python -c "import opencue_proto.report_pb2_grpc"
