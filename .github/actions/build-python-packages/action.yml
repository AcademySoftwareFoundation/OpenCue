name: 'Build Python Packages'
description: Builds the sdist and wheel of every OpenCue Python package and uploads them as opencue_packages.
runs:
  using: composite
  steps:
    - name: Build packages
      shell: bash
      env:
        UV_PYTHON_DOWNLOADS: never
      run: |
        set -euo pipefail
        python -m pip install uv==0.13.7
        for package in proto pycue pyoutline cueadmin cueman cuecmd cuesubmit cuegui rqd cuenimby; do
          uv build --python "$(command -v python)" --sdist --wheel --out-dir packages "./${package}"
        done
        chmod uog+rwX packages/*.*

    - name: Upload opencue packages
      uses: actions/upload-artifact@v7
      with:
        name: opencue_packages
        path: packages
